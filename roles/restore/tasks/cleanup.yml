---

- name: Delete any existing management pod
  k8s:
    name: "{{ ansible_operator_meta.name }}-db-management"
    kind: Pod
    namespace: "{{ backup_pvc_namespace }}"
    state: absent
    force: true

# A restore rolls the database backward independent of the AWX image, so a
# migration Job that already succeeded before the restore is no longer
# trustworthy evidence that the (now-restored) database is current. Deleting
# it here means the next reconcile finds no matching Job and creates a
# fresh one, which re-checks and re-applies migrations against the restored
# database instead of skipping based on stale Job status.
# Match labels on the Job itself, including retained Jobs from before
# image-based naming. The db-management component label is only on Pods.
- name: Find Jobs owned by the restored deployment
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ ansible_operator_meta.namespace }}"
    label_selectors:
      - "app.kubernetes.io/part-of={{ deployment_name }}"
      - "app.kubernetes.io/managed-by={{ deployment_type }}-operator"
  register: restore_migration_jobs

- name: Delete migration Jobs so they re-run against the restored database
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    namespace: "{{ ansible_operator_meta.namespace }}"
    name: "{{ item.metadata.name }}"
    state: absent
  loop: "{{ restore_migration_jobs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: >-
    item.spec.template.spec.containers
    | selectattr('name', 'equalto', 'migration-job') | list | length > 0

- name: Remove ownerReferences from secrets to avoid garbage collection
  k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ item }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
        ownerReferences: null
  loop:
    - '{{ secret_key_secret }}'
    - '{{ admin_password_secret }}'
    - '{{ broadcast_websocket_secret }}'
    - '{{ postgres_configuration_secret }}'
  no_log: "{{ no_log }}"

- name: Cleanup temp spec file
  file:
    path: "{{ tmp_spec.path }}"
    state: absent
  when: tmp_spec.path is defined

- name: Cleanup temp secret vars file
  file:
    path: "{{ secret_vars.path }}"
    state: absent
  when: secret_vars.path is defined
