---

# Kubernetes stamps a Job's own name onto its Pods as the job-name /
# batch.kubernetes.io/job-name label, and label values are capped at 63
# characters - that is the real ceiling for the whole name below, not the
# usual 253-character object name limit. The suffix is a short hash of the
# target image rather than the awx-manage version string: it changes
# whenever the image actually changes (unlike a version string that can
# repeat across builds), so "a Job with this name succeeded" reliably means
# "migrations for this exact image were already run".
- name: Compute a collision-safe migration Job name from the target image
  set_fact:
    migration_job_name: "{{ ansible_operator_meta.name[:42] }}-migration-{{ (_image | hash('sha256'))[:10] }}"
  when: awx_web_pod_name != ''

- block:
    - name: Look up any existing migration Job for this image
      k8s_info:
        api_version: batch/v1
        kind: Job
        namespace: "{{ ansible_operator_meta.namespace }}"
        name: "{{ migration_job_name }}"
      register: existing_migration_job

    - name: Look up task pods to check whether they are stuck waiting for migrations
      k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ ansible_operator_meta.namespace }}"
        label_selectors:
          - "app.kubernetes.io/name={{ ansible_operator_meta.name }}-task"
      register: task_pods

    # Flatten the init-database init container status (the one that runs
    # wait-for-migrations, see deployments/task.yaml.j2) out of every task
    # pod, so we can tell "still blocked on migrations" apart from
    # "crashing for an unrelated reason" or "hasn't started yet".
    - name: Extract the wait-for-migrations init container status from each task pod
      set_fact:
        wait_for_migrations_statuses: >-
          {{ task_pods.resources | default([])
             | map(attribute='status.initContainerStatuses', default=[])
             | sum(start=[])
             | selectattr('name', 'equalto', 'init-database')
             | list }}

    # A database restore that rolls the schema backward independent of the
    # AWX image - for example an external CNPG/barman point-in-time
    # recovery, which this operator has no visibility into and no hook for
    # (unlike a restore done through the AWXRestore CR, see
    # roles/restore/tasks/cleanup.yml) - can leave a migration Job marked
    # succeeded for the *current* image even though the just-restored
    # database predates it. Job status alone can't detect this. Task pods
    # stuck running (not crash-looping, not merely not-yet-started) in this
    # init container are the corroborating, ground-truth signal that
    # migrations genuinely still need to run, regardless of what a
    # same-image Job's cached status claims.
    - name: Determine whether task pods are stuck waiting for migrations
      set_fact:
        task_stuck_waiting_for_migrations: >-
          {{ wait_for_migrations_statuses | selectattr('state.running', 'defined') | list | length > 0 }}

    # Job spec.template is immutable, so an existing Job for this name can
    # never be safely re-applied - it can only be left alone or deleted and
    # recreated. "Dead" deliberately excludes a Job that is still active:
    # deleting a migration Job mid-run would abort a real, in-progress
    # migration on any reconcile that happens to land while it's running
    # (e.g. a long migration plus an unrelated watched-resource change
    # triggering ansible-operator again).
    - name: Determine whether the existing migration Job is dead
      set_fact:
        migration_job_is_dead: >-
          {{ existing_migration_job.resources | default([]) | length > 0 and
             (existing_migration_job.resources[0].status.failed | default(0) > 0 or
              (existing_migration_job.resources[0].status.active | default(0) == 0 and
               existing_migration_job.resources[0].status.succeeded | default(0) != 1)) }}

    # See the wait_for_migrations comment above: a Job can be "succeeded"
    # for this exact image and still be stale evidence if the database was
    # rolled back out from under that image afterward.
    - name: Determine whether the existing migration Job's success is contradicted by live pod state
      set_fact:
        migration_job_stale_success: >-
          {{ existing_migration_job.resources | default([]) | length > 0 and
             existing_migration_job.resources[0].status.succeeded | default(0) == 1 and
             task_stuck_waiting_for_migrations }}

    - name: Delete a migration Job that is dead or contradicted by live pod state
      k8s:
        api_version: batch/v1
        kind: Job
        namespace: "{{ ansible_operator_meta.namespace }}"
        name: "{{ migration_job_name }}"
        state: absent
      when: migration_job_is_dead or migration_job_stale_success

    # The Job's own command checks for pending migrations and applies them
    # using its own (new) image - see jobs/migration.yaml.j2. That removes
    # any dependency on exec-ing into a possibly still-running old pod to
    # decide whether migrations are needed. ignore_errors here covers the
    # rare case of a concurrent reconcile recreating the Job between the
    # lookup above and this apply; that shows up as a failure on this pass
    # and self-heals on the next one, once the existence check above sees
    # the (now real) Job's status.
    - name: Create kubernetes job to perform the migration
      k8s:
        apply: yes
        definition: "{{ lookup('template', 'jobs/migration.yaml.j2') }}"
      register: migrate_result
      ignore_errors: true
      when: >-
        existing_migration_job.resources | default([]) | length == 0
        or migration_job_is_dead
        or migration_job_stale_success

    # This task is really only necessary for new installations. We need to
    # ensure the database has a schema loaded before continuing with the
    # initialization of admin user, etc.
    - name: Watch for the migration job to finish
      k8s_info:
        api_version: batch/v1
        kind: Job
        namespace: "{{ ansible_operator_meta.namespace }}"
        name: "{{ migration_job_name }}"
      register: migrate_watch_result
      until:
        - migrate_watch_result.resources[0].status.succeeded is defined
        - migrate_watch_result.resources[0].status.succeeded == 1
      retries: 180
      delay: 5
      ignore_errors: true
      when: migrate_result is changed

    # Consumed by update_status.yml so status.image/status.version are only
    # stamped once migration for this image is actually confirmed, instead
    # of unconditionally at the end of the reconcile.
    - name: Record whether the migration for this image is confirmed successful
      set_fact:
        migration_confirmed: >-
          {{ migrate_result is skipped or
             (migrate_result is succeeded and migrate_watch_result is defined and not (migrate_watch_result.failed | default(false))) }}

    - name: Report migration Job outcome
      debug:
        msg: >-
          migration Job {{ migration_job_name }}:
          {{ 'already succeeded for this image, nothing to do' if migrate_result is skipped
             else ('recreated - previous success was contradicted by task pods still waiting on migrations' if migration_job_stale_success and migration_confirmed | bool
             else ('confirmed successful' if migration_confirmed | bool
             else 'not confirmed successful - see migrate_result/migrate_watch_result for details')) }}

  when: awx_web_pod_name != ''
