---
# AAP-93430: strip cleartext credentials leaked into the
# kubectl.kubernetes.io/last-applied-configuration annotation.
#
# Operator versions before this one created Secrets with client-side apply,
# which mirrors `kubectl apply` and persists the full submitted manifest -
# stringData included - in that annotation. Read access to Secret *metadata*
# was therefore enough to recover secret data.
#
# Secrets written by this version use server-side apply and never produce the
# annotation, so this annotation is set to null purely to remediate deployments upgraded
# from an affected version. It is a no-op once every managed Secret is clean.
- name: Define secrets name
  set_fact:
    _admin_password: '{{ admin_password_secret | length | ternary(admin_password_secret, ansible_operator_meta.name + "-admin-password") }}'
    _secret_key: '{{ secret_key_secret | length | ternary(secret_key_secret, ansible_operator_meta.name + "-secret-key") }}'
    # yamllint disable-line rule:line-length
    _broadcast_websocket_secret: '{{ broadcast_websocket_secret | length | ternary(broadcast_websocket_secret, ansible_operator_meta.name + "-broadcast-websocket") }}'  # noqa 204
    # yamllint disable-line rule:line-length
    _postgres_configuration: '{{ postgres_configuration_secret | length | ternary(postgres_configuration_secret, ansible_operator_meta.name + "-postgres-configuration") }}'  # noqa 204

- name: Remove kubectl.kubernetes.io/last-applied-configuration annotation
  k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ item }}'
        namespace: '{{ ansible_operator_meta.namespace }}'
        annotations:
          kubectl.kubernetes.io/last-applied-configuration: null
  loop:
    - '{{ _admin_password }}'
    - '{{ _secret_key }}'
    - '{{ _postgres_configuration }}'
    - '{{ _broadcast_websocket_secret }}'
    - '{{ ansible_operator_meta.name }}-receptor-ca'
    - '{{ ansible_operator_meta.name }}-receptor-work-signing'
    - '{{ ansible_operator_meta.name }}-app-credentials'
  no_log: "{{ no_log }}"
